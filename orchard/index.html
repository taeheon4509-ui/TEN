<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>THE ORCHARD</title></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

<div class="orc">
<style>
.orc{
  --bg:#0a0a08; --bg2:#131310; --ink:#f3f1e8; --ink-dim:#b9b6a8; --muted:#7d7a6f;
  --line:rgba(243,241,232,.14); --green:#3f7d52; --green-lt:#8fce9f; --green-dk:#2a5638;
  --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
  background:var(--bg) !important;color:var(--ink) !important;font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:block;
}
.orc *{box-sizing:border-box}
.orc a{color:inherit;text-decoration:none}
.orc img{max-width:100%;display:block}
.orc h1,.orc h2,.orc h3{font-family:var(--serif);font-weight:700;color:var(--ink) !important;margin:0;word-break:keep-all}
.orc p,.orc li,.orc a,.orc span,.orc div{word-break:keep-all}
.orc .wrap{max-width:1240px;margin:0 auto;padding:0 36px}
.orc .accent{color:var(--green-lt) !important}
.orc .eyebrow{font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:.22em;color:var(--green-lt) !important;text-transform:uppercase}
.orc .btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;padding:15px 30px;border-radius:2px;letter-spacing:.03em;transition:all .25s ease}
.orc .btn-p{background:var(--green) !important;color:#fff !important}
.orc .btn-p:hover{background:var(--green-lt) !important;color:#0a0a08 !important}
.orc .btn-o{border:1px solid var(--line);color:var(--ink) !important;background:transparent !important}
.orc .btn-o:hover{border-color:var(--green-lt);color:var(--green-lt) !important}
.orc section{padding:120px 0;background:var(--bg)}
@media(max-width:760px){.orc section{padding:70px 0}}

/* header / nav — no border, blends into hero */
.orc header.nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:26px 0;background:transparent;transition:.35s ease}
.orc header.nav.scrolled{background:rgba(10,10,8,.92) !important;padding:16px 0;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.orc .nav-inner{display:flex;align-items:center;justify-content:space-between}
.orc .brand{font-family:var(--serif);font-size:21px;font-weight:700;color:#fff !important;letter-spacing:.06em}
.orc .brand .dot{color:var(--green-lt) !important}
.orc .nav-links{display:flex;align-items:center;gap:38px}
.orc .nav-links>a{font-size:13.5px;font-weight:500;color:#f3f1e8 !important;letter-spacing:.02em;position:relative;padding:6px 0}
.orc .nav-links>a:hover,.orc .nav-links>a.active{color:var(--green-lt) !important}
.orc .nav-parent{cursor:pointer;font-size:13.5px;font-weight:500;color:#f3f1e8 !important;letter-spacing:.02em;padding:6px 0}
.orc .nav-parent:hover,.orc .nav-parent.active{color:var(--green-lt) !important}
.orc .dropdown.open{opacity:1;visibility:visible}
.orc .has-drop{position:relative}
.orc .dropdown{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:18px;opacity:0;visibility:hidden;transition:.2s ease;min-width:160px}
.orc .has-drop:hover .dropdown{opacity:1;visibility:visible}
.orc .dropdown-inner{background:rgba(12,13,10,.97);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column}
.orc .dropdown-inner a{font-size:13px;padding:10px 14px;color:var(--ink-dim) !important;border-radius:3px;white-space:nowrap}
.orc .dropdown-inner a:hover{background:rgba(143,206,159,.1);color:var(--green-lt) !important}
.orc .nav-cta{background:var(--green) !important;color:#fff !important;padding:11px 22px;border-radius:2px;font-weight:700;font-size:13px}
.orc .nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:30px;height:30px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.orc .nav-toggle span{display:block;width:100%;height:2px;background:#fff;border-radius:2px;transition:.25s ease}
.orc .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.orc .nav-toggle.open span:nth-child(2){opacity:0}
.orc .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:1040px){
  .orc .nav-toggle{display:flex}
  .orc .nav-cta{display:none}
  .orc .nav-links{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,9,7,.98);display:flex;flex-direction:column;align-items:flex-start;padding:100px 36px 40px;gap:0;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-8px);transition:.25s ease;z-index:190}
  .orc .nav-links.mobile-open{opacity:1;visibility:visible;transform:translateY(0)}
  .orc .nav-links>a{display:block;width:100%;padding:18px 0;border-bottom:1px solid var(--line);font-size:17px}
  .orc .has-drop{width:100%;border-bottom:1px solid var(--line)}
  .orc .nav-parent{display:block;width:100%;padding:18px 0;font-size:17px}
  .orc .dropdown{position:static;transform:none;padding-top:0;opacity:1;visibility:visible;display:none;min-width:0}
  .orc .dropdown.open{display:block}
  .orc .dropdown-inner{background:transparent;border:none;padding:0 0 12px 14px}
  .orc .dropdown-inner a{padding:12px 0;font-size:15px}
}

/* hero */
.orc .hero{position:relative;height:100vh;min-height:640px;overflow:hidden;display:block}
.orc .hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:heroFade 18s infinite}
.orc .hero-slide:nth-child(1){animation-delay:0s}
.orc .hero-slide:nth-child(2){animation-delay:6s}
.orc .hero-slide:nth-child(3){animation-delay:12s}
@keyframes heroFade{0%{opacity:0}5%{opacity:1}31%{opacity:1}36%{opacity:0}100%{opacity:0}}
.orc .hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 38%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.75) 100%);z-index:2}
.orc .hero-link{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 24px 60px}
.orc .hero-link:hover .hero-title{color:var(--green-lt) !important}
.orc .hero-eyebrow{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.3em;color:var(--green-lt) !important;text-transform:uppercase;margin-bottom:22px;display:flex;align-items:center;gap:12px}
.orc .hero-eyebrow::before,.orc .hero-eyebrow::after{content:"";width:28px;height:1px;background:var(--green-lt)}
.orc .hero-title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,58px);color:#fff !important;line-height:1.35;transition:color .3s ease;max-width:920px}
.orc .hero-sub{margin-top:22px;font-size:14.5px;color:rgba(243,241,232,.8) !important;letter-spacing:.04em}
.orc .hero-hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;z-index:3;font-size:11.5px;letter-spacing:.18em;color:rgba(243,241,232,.55) !important;text-transform:uppercase}

/* SNS section */
.orc .sns-head{text-align:center;max-width:640px;margin:0 auto 60px}
.orc .sns-head .eyebrow{justify-content:center;display:flex}
.orc .sns-head h2{font-size:clamp(26px,3.4vw,36px);margin:16px 0 18px;font-weight:400}
.orc .sns-head p{color:var(--ink-dim) !important;font-size:14.5px;line-height:1.9}
.orc .marquee{overflow:hidden;position:relative;margin:0 -36px}
.orc .marquee::before,.orc .marquee::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.orc .marquee::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.orc .marquee::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.orc .marquee-track{display:flex;width:max-content;animation:marqueeMove 42s linear infinite}
.orc .marquee-track img{width:280px;height:280px;object-fit:cover;margin-right:14px;filter:saturate(.96)}
@keyframes marqueeMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:760px){.orc .marquee-track img{width:190px;height:190px}}

/* footer */
.orc footer{background:var(--bg2);padding:64px 0 28px;border-top:1px solid var(--line)}
.orc .foot-top{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;padding-bottom:40px;border-bottom:1px solid var(--line)}
.orc .foot-brand .brand{display:block;margin-bottom:14px}
.orc .foot-brand p{color:var(--muted) !important;font-size:13px;max-width:280px;line-height:1.8}
.orc .foot-links{display:flex;gap:60px;flex-wrap:wrap}
.orc .foot-col h4{font-size:12.5px;letter-spacing:.1em;color:var(--green-lt) !important;text-transform:uppercase;margin-bottom:16px;font-weight:700}
.orc .foot-col a{display:block;font-size:13.5px;color:var(--ink-dim) !important;margin-bottom:11px}
.orc .foot-col a:hover{color:var(--ink) !important}
.orc .foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:26px;font-size:12px;color:var(--muted) !important}
.orc .foot-bottom .biz-line{line-height:2}
.orc .foot-actions{display:flex;gap:10px}
.orc .foot-actions a{border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:12px;color:var(--ink-dim) !important}
.orc .foot-actions a:hover{border-color:var(--green-lt);color:var(--green-lt) !important}

.orc .quick-cta{position:fixed;right:26px;bottom:26px;z-index:250;display:flex;align-items:center;gap:9px;padding:15px 24px;font-weight:700;font-size:13.5px;color:#fff !important;background:var(--green) !important;border-radius:2px;box-shadow:0 16px 30px -10px rgba(63,125,82,.55)}
.orc .quick-cta:hover{transform:translateY(-3px)}
.orc .quick-cta .dot{width:7px;height:7px;border-radius:50%;background:#fff}
@media(max-width:760px){.orc .quick-cta{right:14px;bottom:14px;padding:10px 16px;font-size:12px;gap:6px}}
</style>

<header class="nav" id="orcNav">
  <div class="wrap nav-inner">
    <a href="/" class="brand">THE ORCHARD<span class="dot">.</span></a>
    <nav class="nav-links">
      <div class="has-drop">
        <span class="nav-parent">회사안내</span>
        <div class="dropdown"><div class="dropdown-inner">
          <a href="/about">회사소개</a>
          <a href="/facility">시설소개</a>
          <a href="/business">사업소개</a>
        </div></div>
      </div>
      <a href="/brand">브랜드</a>
      <a href="/product">프로덕트</a>
      <a href="/connect">커넥트</a>
      <a href="https://smartstore.naver.com" target="_blank" rel="noopener">공식몰</a>
    </nav>
    <a href="/connect" class="nav-cta">문의하기</a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="hero">
  <div class="hero-slide" style="background-image:url('https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero1.jpg')"></div>
  <div class="hero-slide" style="background-image:url('https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero2.jpg')"></div>
  <div class="hero-slide" style="background-image:url('https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero3.jpg')"></div>
  <div class="hero-scrim"></div>
  <a href="/product" class="hero-link">
    <div class="hero-eyebrow">The Orchard · Premium Fruit</div>
    <h1 class="hero-title">당신의 식탁에, 가장 좋은 계절을 올립니다</h1>
    <p class="hero-sub">산지에서 고른 그날의 최상급 과일만, 오처드의 이름으로.</p>
  </a>
  <div class="hero-hint">Scroll</div>
</div>

<section>
  <div class="wrap">
    <div class="sns-head">
      <div class="eyebrow">S . N . S</div>
      <h2>오처드의 순간들을 만나보세요</h2>
      <p>인스타그램에서 오처드의 산지 이야기와 포장 과정, 그리고 매일의 신선함을 확인하실 수 있습니다.</p>
    </div>
  </div>
  <div class="marquee">
    <div class="marquee-track" id="marqueeTrack">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/facility1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/product4.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero3.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/facility3.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/product1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/business1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero2.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/facility1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/product4.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero3.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/facility3.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/product1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/business1.jpg" alt="">
      <img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/orc-images/hero2.jpg" alt="">
    </div>
  </div>
</section>


<a href="/connect" class="quick-cta"><span class="dot"></span>문의하기</a>

<script>
(function(){
  var navEl = document.getElementById('orcNav');
  function syncNav(){ navEl.classList.toggle('scrolled', window.scrollY > 40); }
  window.addEventListener('scroll', syncNav);
  syncNav();

  document.querySelectorAll('.has-drop').forEach(function(el){
    var label = el.querySelector('.nav-parent');
    var dropdown = el.querySelector('.dropdown');
    if(label && dropdown){
      label.addEventListener('click', function(e){
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });
    }
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.dropdown.open').forEach(function(d){ d.classList.remove('open'); });
  });

  var navToggle = document.getElementById('navToggle');
  var navLinks = document.querySelector('.nav-links');
  if(navToggle && navLinks){
    navToggle.addEventListener('click', function(e){
      e.stopPropagation();
      navToggle.classList.toggle('open');
      navLinks.classList.toggle('mobile-open');
    });
  }
})();
</script>

</div>
</body></html>
