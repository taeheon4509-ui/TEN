<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>오시는길 | 글로우아뜰리에</title></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

<div class="bty">
<style>
.bty{
  --bg:#fffaf8; --bg2:#faf0ed; --ink:#2b2220; --ink-dim:#6b5b57; --muted:#9a8a86;
  --line:#ede0dc; --rose:#c96b7a; --rose-dark:#a8515f;
  --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
  background:var(--bg) !important;color:var(--ink) !important;font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:block;
}
.bty *{box-sizing:border-box}
.bty a{color:inherit;text-decoration:none}
.bty img{max-width:100%;display:block}
.bty .wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.bty .eyebrow{font-family:var(--serif);font-style:italic;font-size:14px;letter-spacing:.12em;color:var(--rose) !important;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;margin-bottom:16px}
.bty .eyebrow::before{content:"";width:22px;height:1px;background:var(--rose)}
.bty h1,.bty h2,.bty h3{font-family:var(--serif);font-weight:700;color:var(--ink) !important;margin:0}
.bty p{margin:0}
.bty section{padding:96px 0;background:var(--bg)}
@media(max-width:760px){.bty section{padding:60px 0} .bty .loc-row{flex-direction:column} .bty .map-photo{flex-basis:auto;width:100%}}

.bty .ph{background-size:cover;background-position:center;position:relative;overflow:hidden}
.bty .ph:empty::after{content:"사진 영역";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.75);letter-spacing:.08em;font-weight:600}
.bty .ph1{background:linear-gradient(150deg,#f3d9d0,#c96b7a)}

.bty header.nav{position:fixed;top:0;left:0;right:0;z-index:150;padding:18px 0;background:#fff;border-bottom:1px solid var(--line);transition:.3s ease}
.bty .nav-inner{display:flex;align-items:center;justify-content:space-between}
.bty .brand{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink) !important;display:flex;align-items:center;gap:9px}
.bty .brand .mark{width:32px;height:32px;border-radius:50%;background:var(--rose) !important;color:#fff !important;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--serif)}
.bty .nav-links{display:flex;gap:26px}
.bty .nav-links a{font-size:13.5px;font-weight:500;color:var(--ink-dim) !important;transition:color .2s}
.bty .nav-links a:hover{color:var(--rose) !important}
.bty .nav-links a.active{color:var(--rose) !important}
.bty .brand,.bty .nav-cta,.bty .nav-toggle{position:relative;z-index:141}
.bty .nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:30px;height:30px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.bty .nav-toggle span{display:block;width:100%;height:2px;background:var(--ink);border-radius:2px;transition:.25s ease}
.bty .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.bty .nav-toggle.open span:nth-child(2){opacity:0}
.bty .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:1040px){
  .bty .nav-toggle{display:flex}
  .bty .nav-cta{padding:9px 16px;font-size:12.5px}
  .bty .nav-links{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:flex;flex-direction:column;align-items:flex-start;padding:100px 32px 40px;gap:0;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-8px);transition:.25s ease;z-index:140}
  .bty .nav-links.mobile-open{opacity:1;visibility:visible;transform:translateY(0)}
  .bty .nav-links a{display:block;width:100%;padding:18px 0;border-bottom:1px solid var(--line);font-size:17px}
}
.bty .nav-cta{background:var(--rose) !important;color:#fff !important;padding:11px 20px;border-radius:2px;font-weight:700;font-size:13.5px}

.bty .page-head{position:relative;padding:180px 0 60px;background:var(--bg2) !important;text-align:center}
.bty .page-head .eyebrow{justify-content:center}
.bty .page-head h1{font-size:clamp(26px,3.6vw,38px);font-weight:400}
.bty .page-head p{color:var(--muted) !important;font-size:14.5px;margin-top:12px}

.bty .loc-row{display:flex;flex-wrap:wrap;gap:50px}
.bty .map-photo{flex:1 1 420px;aspect-ratio:4/3;border-radius:4px;overflow:hidden}
.bty .map-photo img{width:100%;height:100%;object-fit:cover;display:block}
.bty .loc-info{flex:1 1 340px}
.bty .loc-info h3{font-size:19px;margin-bottom:16px;font-weight:700}
.bty .loc-row-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.bty .loc-row-item:first-of-type{border-top:1px solid var(--line)}
.bty .loc-row-item b{flex-shrink:0;width:70px;color:var(--rose) !important;font-size:13px;font-weight:700}
.bty .loc-row-item span{font-size:13.5px;color:var(--ink-dim) !important;line-height:1.7}

.bty footer{padding:34px 0;text-align:center;color:var(--muted) !important;font-size:12px;background:var(--bg)}

.bty .quick-cta{position:fixed;right:26px;bottom:26px;z-index:200;display:flex;align-items:center;gap:9px;padding:15px 24px;font-weight:700;font-size:13.5px;color:#fff !important;background:var(--rose) !important;border-radius:2px;box-shadow:0 16px 30px -10px rgba(201,107,122,.55)}
.bty .quick-cta:hover{transform:translateY(-3px)}
.bty .quick-cta .dot{width:7px;height:7px;border-radius:50%;background:#fff}
</style>

<header class="nav" id="btyNav">
  <div class="wrap nav-inner">
    <a href="/beauty" class="brand"><span class="mark">글</span>글로우아뜰리에</a>
    <nav class="nav-links">
      <a href="/beauty/about">업체소개</a>
      <a href="/beauty/treatment">시술</a>
      <a href="/beauty/review">후기사례</a>
      <a href="/beauty/course">수강신청</a>
      <a href="/beauty/location" class="active">오시는길</a>
      <a href="/beauty/contact">문의하기</a>
    </nav>
    <a href="/beauty/contact" class="nav-cta">문의하기</a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="page-head">
  <div class="wrap">
    <div class="eyebrow">Location</div>
    <h1>오시는 길</h1>
    <p>편안하게 방문하실 수 있도록 안내해드립니다.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="loc-row">
      <div class="map-photo"><img src="https://raw.githubusercontent.com/taeheon4509-ui/TEN/main/bty-images/map.jpg" alt=""></div>
      <div class="loc-info">
        <h3>글로우아뜰리에 오시는 길</h3>
        <div class="loc-row-item"><b>주소</b><span>서울특별시 관악구 관악로 145 인근, 3층</span></div>
        <div class="loc-row-item"><b>전화</b><span>02-987-6543</span></div>
        <div class="loc-row-item"><b>지하철</b><span>2호선 서울대입구역 3번 출구, 도보 8분</span></div>
        <div class="loc-row-item"><b>버스</b><span>관악구청·쑥고개로 정류장 하차 후 도보 3분</span></div>
        <div class="loc-row-item"><b>주차</b><span>건물 내 방문객 주차 1시간 무료 제공</span></div>
        <div class="loc-row-item"><b>운영시간</b><span>평일 10:00–20:00 · 주말 10:00–18:00 (예약제)</span></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">© 2026 글로우아뜰리에 · GLOW ATELIER</div>
</footer>

<a href="/beauty/contact" class="quick-cta"><span class="dot"></span>문의하기</a>

<script>
(function(){
  var navEl = document.getElementById('btyNav');
  window.addEventListener('scroll', function(){ navEl.classList.toggle('scrolled', window.scrollY > 30); });

  var navToggle = document.getElementById('navToggle');
  var navLinks = document.querySelector('.nav-links');
  if(navToggle && navLinks){
    navToggle.addEventListener('click', function(e){
      e.stopPropagation();
      navToggle.classList.toggle('open');
      navLinks.classList.toggle('mobile-open');
    });
  }
})();
</script>

</div>
</body></html>
